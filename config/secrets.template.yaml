# Template for secrets.yaml
# Copy this to secrets.yaml and fill in real values
# Then encrypt with: sops --encrypt secrets.yaml > secrets.enc.yaml

telegram:
  botToken: "YOUR_BOT_TOKEN_HERE"
  allowedUsers:
    - "YOUR_TELEGRAM_USER_ID"

# Test accounts for Playwright smoke tests (optional).
# baseUrl should match healthCheck in projects.yaml.
testAccounts:
  my-web-app:
    baseUrl: "http://localhost:3000"
    accounts:
      user1:
        email: "your-test-user@example.com"
        password: "YOUR_PASSWORD_HERE"
