# DreamTeam Secrets Template
# Copy this to secrets.yaml and fill in your values
# Then encrypt: sops --encrypt secrets.yaml > secrets.enc.yaml

telegram:
    botToken: YOUR_TELEGRAM_BOT_TOKEN
    allowedUsers:
        - "YOUR_TELEGRAM_USER_ID"

# Linear Integration (optional)
# Get your API key from: Linear Settings > Security & Access > API
linear:
    apiKey: lin_api_YOUR_API_KEY_HERE
    teamId: YOUR_TEAM_ID  # Find in Linear URL: linear.app/TEAM_KEY/...
    projectId: YOUR_PROJECT_ID  # Optional: scope to specific project

# Test accounts for projects with auth
# Add entries matching your project names in config/projects.yaml
testAccounts:
    my-web-app:
        baseUrl: http://localhost:3000
        accounts:
            user1:
                email: user1@example.com
                password: YOUR_PASSWORD_HERE
